services:
  mongo:
    image: mongo:7
    container_name: geo-risk-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: geo-risk-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: geo_risk
      MONGO_COLLECTION: geo_events
      # Log15: API does not need HF models — force offline mode
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    build: .
    container_name: geo-risk-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: geo_risk
      MONGO_COLLECTION: geo_events
      # Log15: Quota-aware scheduling config
      NEWSAPI_DAILY_QUOTA: "50"
      GNEWS_DAILY_QUOTA: "50"
      GDELT_DAILY_QUOTA: "500"
      RSS_INTERVAL_SECONDS: "180"
      GDELT_INTERVAL_SECONDS: "900"
      NEWSAPI_INTERVAL_SECONDS: "1800"
      GNEWS_INTERVAL_SECONDS: "1800"
      # Log15: Pre-cached models available offline
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
    depends_on:
      mongo:
        condition: service_healthy
    # Log15: Worker runs at base 180s interval; per-source scheduling is handled
    # internally by QuotaManager (RSS: 3min, GDELT: 15min, APIs: 30min)
    command: ["python", "-m", "ingestion.realtime_worker", "--interval", "180"]
    volumes:
      # Log15: Persist quota state across restarts
      - quota_state:/app/.quota_state

  redis:
    image: redis:7-alpine
    container_name: geo-risk-redis
    restart: unless-stopped
    profiles:
      - cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  analyze:
    build: .
    container_name: geo-risk-analyze
    profiles:
      - cli
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: geo_risk
      MONGO_COLLECTION: geo_events
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: ["python", "run_live.py"]
    command: ["--origin", "Mumbai, India", "--destination", "Dubai, UAE"]

volumes:
  mongo_data:
  redis_data:
  quota_state:
